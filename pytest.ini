[pytest]
testpaths = tests
norecursedirs =
    project
    __pycache__
    .venv
    venv
    .tox
    build
    dist
    .mypy_cache
    .pytest_cache
    .ruff_cache
    node_modules
addopts =
    --strict-markers
    --ignore=src/ml_lifecycle_platform/serving/smoke_test.py
markers =
    unit: fast, hermetic tests that do not require external services
    integration: local multi-component tests using filesystem or sqlite-backed MLflow
    e2e: golden-path platform verification; typically run via docker workflow
