name: CD / Publish Hosted Images

on:
  workflow_call:
    outputs:
      git_sha:
        description: Published Git SHA.
        value: ${{ jobs.build-and-push.outputs.git_sha }}
      mlflow_image:
        description: Published Artifact Registry ref for the MLflow image pinned by digest.
        value: ${{ jobs.build-and-push.outputs.mlflow_image }}
      mlflow_ref:
        description: Published Artifact Registry ref for the MLflow image tag.
        value: ${{ jobs.build-and-push.outputs.mlflow_ref }}
      mlflow_digest:
        description: Published digest for the MLflow image.
        value: ${{ jobs.build-and-push.outputs.mlflow_digest }}
      platform_image:
        description: Published Artifact Registry ref for the platform image pinned by digest.
        value: ${{ jobs.build-and-push.outputs.platform_image }}
      platform_ref:
        description: Published Artifact Registry ref for the platform image.
        value: ${{ jobs.build-and-push.outputs.platform_ref }}
      platform_digest:
        description: Published digest for the platform image.
        value: ${{ jobs.build-and-push.outputs.platform_digest }}
      serving_image:
        description: Published Artifact Registry ref for the serving image pinned by digest.
        value: ${{ jobs.build-and-push.outputs.serving_image }}
      serving_ref:
        description: Published Artifact Registry ref for the serving image.
        value: ${{ jobs.build-and-push.outputs.serving_ref }}
      serving_digest:
        description: Published digest for the serving image.
        value: ${{ jobs.build-and-push.outputs.serving_digest }}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_CI_SERVICE_ACCOUNT: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
  GCP_REGION: europe-west1
  ARTIFACT_REGISTRY_REPOSITORY: mlp-images

jobs:
  build-and-push:
    name: Build And Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      git_sha: ${{ steps.context.outputs.git_sha }}
      mlflow_image: ${{ steps.capture.outputs.mlflow_image }}
      mlflow_ref: ${{ steps.context.outputs.mlflow_ref }}
      mlflow_digest: ${{ steps.capture.outputs.mlflow_digest }}
      platform_image: ${{ steps.capture.outputs.platform_image }}
      platform_ref: ${{ steps.context.outputs.platform_ref }}
      platform_digest: ${{ steps.capture.outputs.platform_digest }}
      serving_image: ${{ steps.capture.outputs.serving_image }}
      serving_ref: ${{ steps.context.outputs.serving_ref }}
      serving_digest: ${{ steps.capture.outputs.serving_digest }}

    steps:
      - id: context
        name: Resolve publish context
        env:
          GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git_sha="${GIT_SHA}"
          repository="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}"

          echo "git_sha=${git_sha}" >> "${GITHUB_OUTPUT}"
          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
          echo "mlflow_ref=${repository}/mlflow:${git_sha}" >> "${GITHUB_OUTPUT}"
          echo "platform_ref=${repository}/platform:${git_sha}" >> "${GITHUB_OUTPUT}"
          echo "serving_ref=${repository}/serving:${git_sha}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ steps.context.outputs.git_sha }}

      - name: Validate required GitHub Actions variables
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for var_name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT; do
            if [[ -z "${!var_name:-}" ]]; then
              missing+=("${var_name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions variable(s): %s\n' "${missing[*]}"
            echo "Set them from Terraform outputs before trusting this workflow."
            echo "Expected values:"
            echo "  GCP_PROJECT_ID <- terraform output project_id"
            echo "  GCP_WIF_PROVIDER <- terraform output workload_identity_provider_name"
            echo "  GCP_CI_SERVICE_ACCOUNT <- terraform output ci_service_account_email"
            exit 1
          fi

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          create_credentials_file: true
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ">= 363.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}

      - id: existing
        name: Resolve existing published images for Git SHA
        env:
          GIT_SHA: ${{ steps.context.outputs.git_sha }}
          MLFLOW_REF: ${{ steps.context.outputs.mlflow_ref }}
          PLATFORM_REF: ${{ steps.context.outputs.platform_ref }}
          SERVING_REF: ${{ steps.context.outputs.serving_ref }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_digest() {
            local image_ref="$1"
            gcloud artifacts docker images describe "${image_ref}" \
              --format='value(image_summary.digest)' \
              2>/dev/null || true
          }

          mlflow_digest="$(resolve_digest "${MLFLOW_REF}")"
          platform_digest="$(resolve_digest "${PLATFORM_REF}")"
          serving_digest="$(resolve_digest "${SERVING_REF}")"

          present_count=0
          for digest in "${mlflow_digest}" "${platform_digest}" "${serving_digest}"; do
            if [[ -n "${digest}" ]]; then
              present_count=$((present_count + 1))
            fi
          done

          if (( present_count > 0 && present_count < 3 )); then
            echo "Found partially published hosted images for git SHA ${GIT_SHA}."
            echo "Refusing to mix reused and rebuilt images for the same release identity."
            exit 1
          fi

          if (( present_count == 3 )); then
            echo "All hosted images already exist for git SHA ${GIT_SHA}; reusing published digests."
            echo "all_exist=true" >> "${GITHUB_OUTPUT}"
            echo "mlflow_digest=${mlflow_digest}" >> "${GITHUB_OUTPUT}"
            echo "platform_digest=${platform_digest}" >> "${GITHUB_OUTPUT}"
            echo "serving_digest=${serving_digest}" >> "${GITHUB_OUTPUT}"
          else
            echo "No hosted images exist yet for git SHA ${GIT_SHA}; building and publishing."
            echo "all_exist=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build MLflow image
        if: steps.existing.outputs.all_exist != 'true'
        env:
          GIT_SHA: ${{ steps.context.outputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file deployments/gcp/mlflow/Dockerfile \
            --tag "mlp-mlflow:${GIT_SHA}" \
            deployments/gcp/mlflow

      - name: Build platform image
        if: steps.existing.outputs.all_exist != 'true'
        env:
          GIT_SHA: ${{ steps.context.outputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --target platform --tag "mlp-platform:${GIT_SHA}" .

      - name: Build serving image
        if: steps.existing.outputs.all_exist != 'true'
        env:
          GIT_SHA: ${{ steps.context.outputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --target serving --tag "mlp-serving:${GIT_SHA}" .

      - name: Smoke test MLflow image
        if: steps.existing.outputs.all_exist != 'true'
        env:
          GIT_SHA: ${{ steps.context.outputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint mlflow "mlp-mlflow:${GIT_SHA}" --version

      - name: Smoke test platform image
        if: steps.existing.outputs.all_exist != 'true'
        env:
          GIT_SHA: ${{ steps.context.outputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "mlp-platform:${GIT_SHA}" \
            python -c "import ml_lifecycle_platform.pipeline.orchestrate"

      - name: Smoke test serving image
        if: steps.existing.outputs.all_exist != 'true'
        env:
          GIT_SHA: ${{ steps.context.outputs.git_sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "mlp-serving:${GIT_SHA}" \
            python -c "import ml_lifecycle_platform.serving.app"

      - name: Log in to Artifact Registry
        if: steps.existing.outputs.all_exist != 'true'
        env:
          REGISTRY_HOST: ${{ env.GCP_REGION }}-docker.pkg.dev
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth print-access-token | docker login \
            --username oauth2accesstoken \
            --password-stdin \
            "https://${REGISTRY_HOST}"

      - name: Push MLflow image
        if: steps.existing.outputs.all_exist != 'true'
        env:
          GIT_SHA: ${{ steps.context.outputs.git_sha }}
          MLFLOW_REF: ${{ steps.context.outputs.mlflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker tag "mlp-mlflow:${GIT_SHA}" "${MLFLOW_REF}"
          docker push "${MLFLOW_REF}"

      - name: Push platform image
        if: steps.existing.outputs.all_exist != 'true'
        env:
          GIT_SHA: ${{ steps.context.outputs.git_sha }}
          PLATFORM_REF: ${{ steps.context.outputs.platform_ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker tag "mlp-platform:${GIT_SHA}" "${PLATFORM_REF}"
          docker push "${PLATFORM_REF}"

      - name: Push serving image
        if: steps.existing.outputs.all_exist != 'true'
        env:
          GIT_SHA: ${{ steps.context.outputs.git_sha }}
          SERVING_REF: ${{ steps.context.outputs.serving_ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker tag "mlp-serving:${GIT_SHA}" "${SERVING_REF}"
          docker push "${SERVING_REF}"

      - id: capture
        name: Capture remote image digests
        env:
          EXISTING_IMAGES: ${{ steps.existing.outputs.all_exist }}
          GIT_SHA: ${{ steps.context.outputs.git_sha }}
          IMAGE_REPOSITORY: ${{ steps.context.outputs.repository }}
          MLFLOW_EXISTING_DIGEST: ${{ steps.existing.outputs.mlflow_digest }}
          MLFLOW_REF: ${{ steps.context.outputs.mlflow_ref }}
          PLATFORM_EXISTING_DIGEST: ${{ steps.existing.outputs.platform_digest }}
          PLATFORM_REF: ${{ steps.context.outputs.platform_ref }}
          SERVING_EXISTING_DIGEST: ${{ steps.existing.outputs.serving_digest }}
          SERVING_REF: ${{ steps.context.outputs.serving_ref }}
        shell: bash
        run: |
          set -euo pipefail

          mlflow_digest="${MLFLOW_EXISTING_DIGEST}"
          platform_digest="${PLATFORM_EXISTING_DIGEST}"
          serving_digest="${SERVING_EXISTING_DIGEST}"

          if [[ -z "${mlflow_digest}" || -z "${platform_digest}" || -z "${serving_digest}" ]]; then
            mlflow_digest="$(
              gcloud artifacts docker images describe "${MLFLOW_REF}" \
                --format='value(image_summary.digest)'
            )"
            platform_digest="$(
              gcloud artifacts docker images describe "${PLATFORM_REF}" \
                --format='value(image_summary.digest)'
            )"
            serving_digest="$(
              gcloud artifacts docker images describe "${SERVING_REF}" \
                --format='value(image_summary.digest)'
            )"
          fi

          if [[ -z "${mlflow_digest}" || -z "${platform_digest}" || -z "${serving_digest}" ]]; then
            echo "Failed to resolve one or more image digests from Artifact Registry."
            exit 1
          fi

          echo "mlflow_digest=${mlflow_digest}" >> "${GITHUB_OUTPUT}"
          echo "platform_digest=${platform_digest}" >> "${GITHUB_OUTPUT}"
          echo "serving_digest=${serving_digest}" >> "${GITHUB_OUTPUT}"
          echo "mlflow_image=${MLFLOW_REF%:*}@${mlflow_digest}" >> "${GITHUB_OUTPUT}"
          echo "platform_image=${PLATFORM_REF%:*}@${platform_digest}" >> "${GITHUB_OUTPUT}"
          echo "serving_image=${SERVING_REF%:*}@${serving_digest}" >> "${GITHUB_OUTPUT}"

          export IMAGE_DIGESTS_JSON="${RUNNER_TEMP}/image-digests.json"
          export MLFLOW_DIGEST="${mlflow_digest}"
          export PLATFORM_DIGEST="${platform_digest}"
          export SERVING_DIGEST="${serving_digest}"
          export IMAGE_GIT_SHA="${GIT_SHA}"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "project_id": os.environ["GCP_PROJECT_ID"],
              "repository": os.environ["IMAGE_REPOSITORY"],
              "git_sha": os.environ["IMAGE_GIT_SHA"],
              "images": {
                  "mlflow": {
                      "tag": os.environ["IMAGE_GIT_SHA"],
                      "ref": os.environ["MLFLOW_REF"],
                      "digest": os.environ["MLFLOW_DIGEST"],
                  },
                  "platform": {
                      "tag": os.environ["IMAGE_GIT_SHA"],
                      "ref": os.environ["PLATFORM_REF"],
                      "digest": os.environ["PLATFORM_DIGEST"],
                  },
                  "serving": {
                      "tag": os.environ["IMAGE_GIT_SHA"],
                      "ref": os.environ["SERVING_REF"],
                      "digest": os.environ["SERVING_DIGEST"],
                  },
              },
          }
          Path(os.environ["IMAGE_DIGESTS_JSON"]).write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          cp "${IMAGE_DIGESTS_JSON}" "${GITHUB_WORKSPACE}/image-digests.json"

      - name: Write workflow summary
        env:
          EXISTING_IMAGES: ${{ steps.existing.outputs.all_exist }}
          MLFLOW_REF: ${{ steps.context.outputs.mlflow_ref }}
          MLFLOW_DIGEST: ${{ steps.capture.outputs.mlflow_digest }}
          PLATFORM_REF: ${{ steps.context.outputs.platform_ref }}
          PLATFORM_DIGEST: ${{ steps.capture.outputs.platform_digest }}
          SERVING_REF: ${{ steps.context.outputs.serving_ref }}
          SERVING_DIGEST: ${{ steps.capture.outputs.serving_digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EXISTING_IMAGES}" == "true" ]]; then
            publication_mode="reused existing digests for this git SHA"
          else
            publication_mode="published new images for this git SHA"
          fi
          {
            echo "## Published images"
            echo
            echo "- Mode: ${publication_mode}"
            echo "| Image | Ref | Digest |"
            echo "| --- | --- | --- |"
            echo "| mlflow | \`${MLFLOW_REF}\` | \`${MLFLOW_DIGEST}\` |"
            echo "| platform | \`${PLATFORM_REF}\` | \`${PLATFORM_DIGEST}\` |"
            echo "| serving | \`${SERVING_REF}\` | \`${SERVING_DIGEST}\` |"
            echo
            echo "Artifact: \`image-digests.json\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload image digests artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: image-digests-${{ steps.context.outputs.git_sha }}
          path: image-digests.json
          if-no-files-found: error
