name: CI / Local E2E

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11.7"
  UV_PYTHON_DOWNLOADS: never

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Fail if forbidden paths are tracked
        run: |
          set -euo pipefail
          forbidden_regex='(^mlruns/|^mlartifacts/|^\.venv/|^venv/|^\.pytest_cache/|^\.mypy_cache/|^\.ruff_cache/|^__pycache__/|\.DS_Store$|^data/|^artifacts/)'
          if git ls-files | egrep -n "${forbidden_regex}"; then
            echo ""
            echo "ERROR: Forbidden files are tracked by git. Remove them from the index and add them to .gitignore."
            exit 1
          fi

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Run E2E
        run: |
          set -euo pipefail
          make test-e2e

      - name: Dump docker state (on failure)
        if: failure()
        run: |
          set -euo pipefail
          docker compose ps
          docker compose logs --no-color > docker-compose.log || true

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-logs-${{ github.run_id }}
          path: docker-compose.log
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          make down || true
