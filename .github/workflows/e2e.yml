name: CI / Local E2E

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11.7"
  UV_PYTHON_DOWNLOADS: never

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Fail if forbidden paths are tracked
        run: |
          set -euo pipefail
          forbidden_regex='(^mlruns/|^mlartifacts/|^\.venv/|^venv/|^\.pytest_cache/|^\.mypy_cache/|^\.ruff_cache/|^__pycache__/|\.DS_Store$|^data/|^artifacts/)'
          if git ls-files | egrep -n "${forbidden_regex}"; then
            echo ""
            echo "ERROR: Forbidden files are tracked by git. Remove them from the index and add them to .gitignore."
            exit 1
          fi

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Run E2E
        run: |
          set -euo pipefail
          make test-e2e

      - name: Dump docker state (on failure)
        if: failure()
        run: |
          set -euo pipefail
          docker compose ps
          docker compose logs --no-color > docker-compose.log || true

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-logs-${{ github.run_id }}
          path: docker-compose.log
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          make down || true
