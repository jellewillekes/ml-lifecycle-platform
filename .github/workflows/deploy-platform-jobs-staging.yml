name: CD / Deploy Platform Jobs / Staging

on:
  workflow_call:
    inputs:
      platform_image:
        description: Digest-pinned Artifact Registry ref for the hosted platform image to deploy.
        required: true
        type: string
    outputs:
      platform_image:
        description: Deployed platform image pinned by digest.
        value: ${{ jobs.deploy.outputs.platform_image }}
      job_names:
        description: Comma-separated deployed Cloud Run Job names.
        value: ${{ jobs.deploy.outputs.job_names }}
  workflow_dispatch:
    inputs:
      platform_image:
        description: Digest-pinned Artifact Registry ref for the hosted platform image to deploy.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-platform-jobs-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_CI_SERVICE_ACCOUNT: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
  GCP_REGION: europe-west1

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      platform_image: ${{ steps.context.outputs.platform_image }}
      job_names: ${{ steps.jobs.outputs.job_names }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Validate required GitHub Actions variables
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for var_name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_CI_SERVICE_ACCOUNT; do
            if [[ -z "${!var_name:-}" ]]; then
              missing+=("${var_name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions variable(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - id: context
        name: Validate deploy image input
        env:
          INPUT_PLATFORM_IMAGE: ${{ inputs.platform_image }}
        shell: bash
        run: |
          set -euo pipefail

          platform_image="${INPUT_PLATFORM_IMAGE}"
          if [[ -z "${platform_image}" ]]; then
            echo "Provide platform_image as a digest-pinned Artifact Registry ref."
            exit 1
          fi
          if [[ "${platform_image}" != *@sha256:* ]]; then
            echo "platform_image must be pinned by digest, for example .../platform@sha256:..."
            exit 1
          fi
          if [[ "${platform_image%@*}" == *:* ]]; then
            echo "platform_image must be a pure digest ref without a tag, for example .../platform@sha256:..."
            exit 1
          fi

          echo "platform_image=${platform_image}" >> "${GITHUB_OUTPUT}"

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          create_credentials_file: true
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 363.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify platform image exists in Artifact Registry
        env:
          PLATFORM_IMAGE: ${{ steps.context.outputs.platform_image }}
        shell: bash
        run: |
          set -euo pipefail
          digest="$(
            gcloud artifacts docker images describe "${PLATFORM_IMAGE}" \
              --format='value(image_summary.digest)'
          )"
          if [[ -z "${digest}" ]]; then
            echo "Failed to resolve platform image digest from Artifact Registry."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/retry_terraform_gcp_init.sh

      - id: mlflow
        name: Resolve current hosted MLflow contract
        shell: bash
        run: |
          set -euo pipefail
          export MLFLOW_SERVICE_JSON="${RUNNER_TEMP}/mlflow-service.json"
          terraform -chdir=deployments/gcp/terraform output -json mlflow_service > "${MLFLOW_SERVICE_JSON}"
          mlflow_image="$(python3 - "${MLFLOW_SERVICE_JSON}" <<'PY'
          import json
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))
          if value is None:
              raise SystemExit(
                  "mlflow_service output is null; deploy hosted MLflow before platform jobs."
              )
          print(value["image"])
          PY
          )"
          echo "mlflow_image=${mlflow_image}" >> "${GITHUB_OUTPUT}"

      - id: serving
        name: Resolve current hosted serving contract
        shell: bash
        run: |
          set -euo pipefail
          export SERVING_SERVICE_JSON="${RUNNER_TEMP}/serving-service.json"
          terraform -chdir=deployments/gcp/terraform output -json serving_service > "${SERVING_SERVICE_JSON}"
          serving_image="$(python3 - "${SERVING_SERVICE_JSON}" <<'PY'
          import json
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))
          if value is None:
              raise SystemExit(
                  "serving_service output is null; deploy hosted serving before platform jobs."
              )
          print(value["image"])
          PY
          )"
          echo "serving_image=${serving_image}" >> "${GITHUB_OUTPUT}"

      - name: Terraform apply hosted platform jobs staging
        env:
          TF_VAR_mlflow_image: ${{ steps.mlflow.outputs.mlflow_image }}
          TF_VAR_serving_image: ${{ steps.serving.outputs.serving_image }}
          TF_VAR_platform_image: ${{ steps.context.outputs.platform_image }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=deployments/gcp/terraform apply -auto-approve -input=false

      - id: jobs
        name: Resolve deployed platform jobs
        shell: bash
        run: |
          set -euo pipefail
          export PLATFORM_JOBS_JSON="${RUNNER_TEMP}/platform-jobs.json"
          terraform -chdir=deployments/gcp/terraform output -json platform_jobs > "${PLATFORM_JOBS_JSON}"
          python3 - "${PLATFORM_JOBS_JSON}" "${GITHUB_OUTPUT}" <<'PY'
          import json
          import sys

          jobs = json.load(open(sys.argv[1], encoding="utf-8"))
          if not jobs:
            raise SystemExit("platform_jobs output is null after apply.")
          names = ",".join(sorted(job["name"] for job in jobs.values()))
          with open(sys.argv[2], "a", encoding="utf-8") as handle:
            handle.write(f"job_names={names}\n")
          PY

      - name: Write workflow summary
        env:
          PLATFORM_IMAGE: ${{ steps.context.outputs.platform_image }}
          JOB_NAMES: ${{ steps.jobs.outputs.job_names }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Hosted platform jobs staging"
            echo
            echo "- Platform image: \`${PLATFORM_IMAGE}\`"
            echo "- Jobs: \`${JOB_NAMES}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
