name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Fail if forbidden paths are tracked
        shell: bash
        run: |
          set -euo pipefail
          forbidden_regex='(^mlruns/|^mlartifacts/|^\.venv/|^venv/|^\.pytest_cache/|^\.mypy_cache/|^\.ruff_cache/|^__pycache__/|\.DS_Store$|^data/|^artifacts/)'
          if git ls-files | egrep -n "${forbidden_regex}"; then
            echo "Forbidden files are tracked by git. Remove from the index and add to .gitignore."
            exit 1
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: hygiene

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync (locked)
        run: |
          set -euo pipefail
          uv sync --frozen --group dev

      - name: Ruff format
        run: |
          set -euo pipefail
          uv run ruff format --check .

      - name: Ruff lint
        run: |
          set -euo pipefail
          uv run ruff check --output-format=github .


  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: hygiene

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync (locked)
        run: |
          set -euo pipefail
          uv sync --frozen --group dev

      - name: Mypy
        run: |
          set -euo pipefail
          uv run mypy \
            --config-file mypy.ini \
            src tests \
            | tee mypy.txt

      - name: Upload mypy output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mypy-output
          path: mypy.txt


  unit:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: hygiene

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync (locked)
        run: |
          set -euo pipefail
          uv sync --frozen --group dev

      - name: Run unit tests
        run: |
          set -euo pipefail
          uv run pytest -q -m unit --maxfail=1 --disable-warnings \
            --cov=ml_lifecycle_platform \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            | tee pytest.txt

      - name: Upload pytest output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output
          path: pytest.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          flags: unit
          name: unit-tests
          fail_ci_if_error: false
          verbose: true

  integration:
    name: Integration Tests (pytest)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, unit]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync (locked)
        run: |
          set -euo pipefail
          uv sync --frozen --group dev

      - name: Run integration tests
        run: |
          set -euo pipefail
          uv run pytest -q -m integration --maxfail=1 --disable-warnings | tee pytest-integration.txt

      - name: Upload integration pytest output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-integration-output
          path: pytest-integration.txt
