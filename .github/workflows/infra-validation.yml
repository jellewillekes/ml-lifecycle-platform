name: CI / Infra Validation

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/infra-validation.yml"
      - "Makefile"
      - "deployments/gcp/terraform/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/infra-validation.yml"
      - "Makefile"
      - "deployments/gcp/terraform/**"

permissions:
  contents: read

concurrency:
  group: infra-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt
        run: |
          set -euo pipefail
          make terraform-gcp-fmt

      - name: Terraform init (backend disabled)
        run: |
          set -euo pipefail
          terraform -chdir=deployments/gcp/terraform init -backend=false -input=false

      - name: Terraform validate
        run: |
          set -euo pipefail
          make terraform-gcp-validate
