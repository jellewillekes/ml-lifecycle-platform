name: CI / Infra Validation

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/infra-validation.yml"
      - "Makefile"
      - "deployments/gcp/terraform/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/infra-validation.yml"
      - "Makefile"
      - "deployments/gcp/terraform/**"

permissions:
  contents: read

concurrency:
  group: infra-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt
        run: |
          set -euo pipefail
          make terraform-gcp-fmt

      - name: Terraform init (backend disabled)
        run: |
          set -euo pipefail
          terraform -chdir=deployments/gcp/terraform init -backend=false -input=false

      - name: Terraform validate
        run: |
          set -euo pipefail
          make terraform-gcp-validate
