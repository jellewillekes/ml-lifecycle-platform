[mypy]
python_version = 3.11

warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
no_implicit_optional = True

explicit_package_bases = True
namespace_packages = True

mypy_path =
    src

ignore_missing_imports = True

# Keep it simple: third-party libs without types shouldn't fail the build.
disable_error_code = import-untyped

pretty = True
show_error_codes = True
show_column_numbers = True
error_summary = True

# Robust one-liner exclude (avoids INI + (?x) multiline parsing issues)
exclude = ^(\.venv|venv|\.tox|build|dist|\.mypy_cache|\.ruff_cache|\.pytest_cache|\.git|node_modules|__pycache__)(/|$)

[mypy-tests.*]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-*.tests.*]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-tests.unit.serving.tests.*]
disable_error_code = attr-defined
