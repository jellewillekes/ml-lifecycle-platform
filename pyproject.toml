[project]
name = "ml-lifecycle-platform"
version = "0.5.2"
requires-python = ">=3.11.7"
dependencies = [
    "boto3>=1.42.34",
    "fastapi>=0.128.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "mlflow>=2.13,<3.0",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "pandera>=0.26.1",
    "prometheus-client>=0.20,<1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "uvicorn>=0.40.0",
]

[project.scripts]
mlp = "ml_lifecycle_platform.cli.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.14",
    "types-requests>=2.32.4.20260107",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_lifecycle_platform"]

[tool.coverage.run]
branch = true
source = ["src/ml_lifecycle_platform"]
omit = [
    "src/ml_lifecycle_platform/__init__.py",
    "src/ml_lifecycle_platform/serving/smoke_test.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"
