schema_version: model_spec/v1
model_name: breast_cancer_clf
task: binary_classifier
label_column: target
source:
  kind: sklearn_demo
  dataset_name: breast_cancer
split:
  test_size: 0.2
  random_state: 42
  stratify: true
preprocessor:
  kind: standard_scaler
trainer:
  kind: logistic_regression
  max_iter: 2000
  solver: lbfgs
  class_weight: balanced
  random_state: 42
evaluation:
  metrics:
    - accuracy
    - f1
    - roc_auc
  gate:
    metric: roc_auc
    threshold: 0.95
model_validation:
  # This model separates the classes well (roc_auc ~0.99), so the gates are
  # real: an overall floor, a bounded regression vs. the previous run, and a
  # minimum on the larger-radius slice where malignant cases concentrate.
  metric: roc_auc
  min_overall: 0.90
  max_regression: 0.05
  segments:
    - name: large_radius
      column: mean radius
      min: 15.0
      min_metric: 0.85
feature_contract:
  version: breast_cancer_clf.input/v1
  allow_unknown_fields: false
  features:
    - name: mean radius
      dtype: float
    - name: mean texture
      dtype: float
    - name: mean perimeter
      dtype: float
    - name: mean area
      dtype: float
    - name: mean smoothness
      dtype: float
    - name: mean compactness
      dtype: float
    - name: mean concavity
      dtype: float
    - name: mean concave points
      dtype: float
    - name: mean symmetry
      dtype: float
    - name: mean fractal dimension
      dtype: float
    - name: radius error
      dtype: float
    - name: texture error
      dtype: float
    - name: perimeter error
      dtype: float
    - name: area error
      dtype: float
    - name: smoothness error
      dtype: float
    - name: compactness error
      dtype: float
    - name: concavity error
      dtype: float
    - name: concave points error
      dtype: float
    - name: symmetry error
      dtype: float
    - name: fractal dimension error
      dtype: float
    - name: worst radius
      dtype: float
    - name: worst texture
      dtype: float
    - name: worst perimeter
      dtype: float
    - name: worst area
      dtype: float
    - name: worst smoothness
      dtype: float
    - name: worst compactness
      dtype: float
    - name: worst concavity
      dtype: float
    - name: worst concave points
      dtype: float
    - name: worst symmetry
      dtype: float
    - name: worst fractal dimension
      dtype: float
policy:
  required_metadata_tags:
    - dataset_fingerprint
    - git_sha
    - config_hash
    - training_run_id
  required_release_status: candidate
  block_noop_promotion: true
  require_reproducibility_evidence: false
  minimum_metric_thresholds: []
