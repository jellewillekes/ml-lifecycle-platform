schema_version: model_spec/v1
model_name: binance_btc_1m
task: binary_classifier
label_column: target
source:
  kind: binance
  symbol: BTCUSDT
  interval: 1m
  limit: 1000
split:
  method: chronological
  test_size: 0.2
  random_state: 42
  stratify: false
preprocessor:
  kind: standard_scaler
trainer:
  kind: lightgbm
  n_estimators: 200
  learning_rate: 0.05
  num_leaves: 15
  max_depth: 4
  min_child_samples: 20
  class_weight: balanced
  random_state: 42
evaluation:
  metrics:
    - accuracy
    - f1
    - roc_auc
  gate:
    # Next-bar BTC direction is near-random; this is a POC bar that lets the
    # golden path reach serving, not a real quality threshold. The gate can
    # legitimately fail on an unlucky window - that is the platform working.
    metric: roc_auc
    threshold: 0.50
feature_contract:
  version: binance_btc_1m.input/v1
  allow_unknown_fields: false
  features:
    - name: ret_1
      dtype: float
    - name: ret_5
      dtype: float
    - name: momentum_10
      dtype: float
    - name: ema_ratio_fast
      dtype: float
    - name: rsi_14
      dtype: float
    - name: vol_20
      dtype: float
validation:
  # ~970 rows survive after rolling-window warmup; 500 is a safe floor that
  # still catches a truncated or empty ingest.
  min_rows: 500
  # Sanity bounds, not statistical gates: they catch scale/unit/NaN bugs in
  # featurization, not model quality (that is UP-50's job).
  feature_ranges:
    - name: rsi_14
      min: 0.0
      max: 100.0
    - name: ret_1
      min: -0.5
      max: 0.5
    - name: ret_5
      min: -0.5
      max: 0.5
    - name: vol_20
      min: 0.0
      max: 1.0
model_validation:
  # Near-random next-bar model: keep the model gate lenient so continuous
  # training stays non-flaky. The overall floor matches the POC eval gate; no
  # segment or regression gates yet - those tighten once UP-31 lands a real
  # previous-prod baseline.
  metric: roc_auc
  min_overall: 0.50
policy:
  required_metadata_tags:
    - dataset_fingerprint
    - git_sha
    - config_hash
    - training_run_id
  required_release_status: candidate
  block_noop_promotion: true
  require_reproducibility_evidence: false
  minimum_metric_thresholds: []
